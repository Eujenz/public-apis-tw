name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validate catalog schema and rules
        run: uv run python scripts/validate_catalog.py

      - name: Run test suite
        run: uv run pytest

      - name: Build catalog docs and JSON
        run: uv run python scripts/build_catalog.py

      - name: Check git status for uncommitted build artifacts
        run: |
          git status --porcelain
